# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://0.0.0.0:5432/coursemgmt
quarkus.datasource.username=coursemgmt
quarkus.datasource.password=coursemgmt123
quarkus.datasource.jdbc.max-size=8

# Hibernate ORM Configuration
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.batch-fetch-size=20
quarkus.hibernate-orm.jdbc.batch-size=20
quarkus.hibernate-orm.jdbc.batch-insert=true
quarkus.hibernate-orm.jdbc.batch-update=true

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# JWT Configuration
smallrye.jwt.sign.key.location=META-INF/private-key.pem
smallrye.jwt.verify.key.location=META-INF/public-key.pem
mp.jwt.verify.issuer=coursemgmt
mp.jwt.verify.publickey.location=META-INF/public-key.pem
smallrye.jwt.roles.claim=groups
quarkus.smallrye-jwt.roles.claim=groups

# Health
quarkus.smallrye-health.root-path=/health

# CORS Configuration
quarkus.http.cors.enabled=true
# Allow frontend running on localhost:4200 (and 127.0.0.1:4200). Keep generic localhost entries for flexibility.
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://127.0.0.1,http://localhost:8080
# Allowed HTTP methods from the browser
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
# Allowed request headers (include Authorization and common headers used by the frontend)
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Origin,User-Agent,Referer,Accept-Encoding,Accept-Language
# Headers that may be exposed to the browser
quarkus.http.cors.exposed-headers=Authorization,Content-Type
quarkus.http.cors.credentials=true
# Preflight cache duration (seconds)
quarkus.http.cors.max-age=1800

# Server Configuration
## Use alternative port in dev to avoid conflicts if 8080 is already bound
quarkus.http.port=8082
quarkus.application.name=coursemgmt
quarkus.application.version=1.0.0

# Logging
quarkus.log.level=DEBUG

# Security JPA Configuration
quarkus.security.jpa.enabled=true
